<!-- @dsCard group="Data display" height=200 -->
<!doctype html>
<html><head><meta charset="utf-8"><title>KpiCard</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"></head>
<body><div class="nr-stage">
<article class="nr-card nr-kpi" style="width:290px">
  <h3 class="nr-kpi-label">Total Pendapatan</h3>
  <p class="nr-kpi-value" title="Rp 42.560.118.400"><span class="nr-cur">Rp</span>42,56 M</p>
  <div class="nr-kpi-foot"><span class="nr-delta nr-delta-up">▲ 2,84%</span><span>Bulan lalu Rp 41,38 M</span></div>
</article>
<article class="nr-card nr-kpi" style="width:290px">
  <h3 class="nr-kpi-label">Total Beban</h3>
  <p class="nr-kpi-value" title="Rp 28.358.904.120"><span class="nr-cur">Rp</span>28,36 M</p>
  <div class="nr-kpi-foot"><span class="nr-delta nr-delta-down">▲ 4,78%</span><span>Bulan lalu Rp 27,07 M</span></div>
</article>
<article class="nr-card nr-kpi" style="width:290px">
  <h3 class="nr-kpi-label">Laba Bersih</h3>
  <p class="nr-kpi-value" title="Rp 14.201.214.280"><span class="nr-cur">Rp</span>14,20 M</p>
  <div class="nr-kpi-foot"><span class="nr-delta nr-delta-up">▲ 1,98%</span><span>Bulan lalu Rp 13,92 M</span></div>
</article>
</div></body></html>
