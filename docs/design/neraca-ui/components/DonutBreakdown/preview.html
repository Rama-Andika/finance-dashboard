<!doctype html>
<html><head><meta charset="utf-8"><title>DonutBreakdown</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"></head>
<body><div class="nr-stage">

  <svg class="nr-donut-ring" viewBox="0 0 160 160" width="168" height="168" style="align-self:center" role="img" aria-label="Komposisi beban Oktober 2026, total 28,36 miliar. Terbesar gaji dan tunjangan 42 persen.">
    <g transform="rotate(-90 80 80)">
      <circle class="s1" cx="80" cy="80" r="60" stroke-dasharray="156.3 220.7" stroke-dashoffset="0"/>
      <circle class="s2" cx="80" cy="80" r="60" stroke-dasharray="77.2 299.8" stroke-dashoffset="-158.3"/>
      <circle class="s3" cx="80" cy="80" r="60" stroke-dasharray="50.8 326.2" stroke-dashoffset="-237.5"/>
      <circle class="s4" cx="80" cy="80" r="60" stroke-dasharray="39.5 337.5" stroke-dashoffset="-290.3"/>
      <circle class="s5" cx="80" cy="80" r="60" stroke-dasharray="43.2 333.8" stroke-dashoffset="-331.8"/>
    </g>
    <text class="nr-donut-caption" x="80" y="72" text-anchor="middle">Total beban</text>
    <text class="nr-donut-center" x="80" y="94" text-anchor="middle">Rp 28,36 M</text>
  </svg>
  <ul class="nr-donut-list">
    <li><span class="nr-chip nr-chip-1">42%</span><span>Gaji &amp; Tunjangan</span><b>Rp 11,91 M</b></li>
    <li><span class="nr-chip nr-chip-2">21%</span><span>Sewa Toko</span><b>Rp 5,96 M</b></li>
    <li><span class="nr-chip nr-chip-3">14%</span><span>Listrik &amp; Air</span><b>Rp 3,97 M</b></li>
    <li><span class="nr-chip nr-chip-4">11%</span><span>Iklan &amp; Promosi</span><b>Rp 3,12 M</b></li>
    <li><span class="nr-chip nr-chip-5">12%</span><span>Lainnya</span><b>Rp 3,40 M</b></li>
  </ul>
</section>
</div></body></html>
