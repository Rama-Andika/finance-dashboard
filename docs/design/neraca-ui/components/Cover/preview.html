<!-- @dsCard height=288 -->
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Neraca UI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--canvas); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .forest { fill: var(--forest); }
  .lime { fill: var(--lime); }
  .halo { fill: var(--lime-soft); }
  .arc { fill: none; stroke: var(--forest-line); stroke-width: 1; }
  .zero { stroke: var(--chart-axis); stroke-width: 1; }
  .in { fill: var(--chart-income); }
  .out { fill: var(--chart-expense); }
  .slab { rx: var(--radius-lg); }
  .bar { rx: var(--radius-xs); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 104px; line-height: 0.95; font-weight: 700; letter-spacing: -0.03em; color: var(--ink); }
  .tag { margin: var(--space-2) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      forest 176×232 slab bled off the top-right (the Cash Position card) · lime 176×56 bled off the bottom (the active/income accent) · lime-soft halo 28×176 (the selected month) — ≈ 28% of 960×288
  arrangement one tall forest slab with a lime foot on the right; the pattern runs left of it on the ground, clear of the name (box starts at x = 480)
  pattern     diverging bars around a zero line — the system's signature chart (cash in up in chart-income, cash out down in chart-expense); chosen because "Angka dulu" and the cash-flow card are what the README leads with
  scales      bar width space-4 at a space-6 pitch; slab and foot corners radius-lg; bar ends radius-xs; arcs in forest-line inside the slab only
-->
<defs><clipPath id="slabclip"><rect x="304" y="-16" width="176" height="232" rx="16"/></clipPath></defs>
<rect class="forest slab" x="304" y="-16" width="176" height="232"/>
<g clip-path="url(#slabclip)"><circle class="arc" cx="480" cy="0" r="64"/><circle class="arc" cx="480" cy="0" r="104"/><circle class="arc" cx="480" cy="0" r="144"/></g>
<rect class="lime slab" x="304" y="232" width="176" height="72"/>
<rect class="halo" x="186" y="72" width="28" height="176" rx="12"/>
<rect class="in bar" x="24" y="112" width="16" height="62"/>
<rect class="in bar" x="48" y="140" width="16" height="34"/>
<rect class="in bar" x="72" y="124" width="16" height="50"/>
<rect class="in bar" x="96" y="104" width="16" height="70"/>
<rect class="in bar" x="120" y="128" width="16" height="46"/>
<rect class="in bar" x="144" y="112" width="16" height="62"/>
<rect class="in bar" x="168" y="144" width="16" height="30"/>
<rect class="in bar" x="192" y="80" width="16" height="94"/>
<rect class="in bar" x="216" y="120" width="16" height="54"/>
<rect class="in bar" x="240" y="124" width="16" height="50"/>
<rect class="in bar" x="264" y="136" width="16" height="38"/>
<rect class="out bar" x="24" y="178" width="16" height="42"/>
<rect class="out bar" x="48" y="178" width="16" height="62"/>
<rect class="out bar" x="72" y="178" width="16" height="54"/>
<rect class="out bar" x="96" y="178" width="16" height="22"/>
<rect class="out bar" x="120" y="178" width="16" height="42"/>
<rect class="out bar" x="144" y="178" width="16" height="30"/>
<rect class="out bar" x="168" y="178" width="16" height="34"/>
<rect class="out bar" x="192" y="178" width="16" height="62"/>
<rect class="out bar" x="216" y="178" width="16" height="46"/>
<rect class="out bar" x="240" y="178" width="16" height="38"/>
<rect class="out bar" x="264" y="178" width="16" height="50"/>
<line class="zero" x1="16" x2="288" y1="176" y2="176"/>
</svg>
</div>
<div class="words">
<h1 class="name">Neraca<br>UI</h1>
<p class="tag">Angka dulu, hiasan belakangan.</p>
</div>
</div>
</body>
</html>
