<!doctype html>
<html><head><meta charset="utf-8"><title>AgingBar</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"></head>
<body><div class="nr-stage" style="display:block">
<section class="nr-card nr-aging" style="max-width:720px">
  <div class="nr-card-head" style="margin:0"><h3 class="nr-card-title">Umur Utang Usaha</h3><span class="nr-muted nr-num" style="font-size:13px">Total Rp 56,70 M per 28 Okt 2026</span></div>
  <div class="nr-aging-bar" role="img" aria-label="Belum jatuh tempo 55 persen, 0 sampai 30 hari 22 persen, 31 sampai 60 hari 12 persen, 61 sampai 90 hari 7 persen, lebih dari 90 hari 4 persen.">
    <span class="nr-ag-0" style="width:55%"></span><span class="nr-ag-1" style="width:22%"></span><span class="nr-ag-2" style="width:12%"></span><span class="nr-ag-3" style="width:7%"></span><span class="nr-ag-4" style="width:4%"></span>
  </div>
  <dl class="nr-aging-keys">
    <div><dt><i class="nr-ag-0"></i>Belum jatuh tempo</dt><dd>Rp 31,20 M</dd></div>
    <div><dt><i class="nr-ag-1"></i>0 – 30 hari</dt><dd>Rp 12,40 M</dd></div>
    <div><dt><i class="nr-ag-2"></i>31 – 60 hari</dt><dd>Rp 6,80 M</dd></div>
    <div><dt><i class="nr-ag-3"></i>61 – 90 hari</dt><dd>Rp 3,90 M</dd></div>
    <div><dt><i class="nr-ag-4"></i>&gt; 90 hari</dt><dd>Rp 2,40 M</dd></div>
  </dl>
</section>
</div></body></html>
