<!doctype html>
<html><head><meta charset="utf-8"><title>EntityPicker</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"></head>
<body><div class="nr-stage">
<div class="nr-menu nr-picker" role="dialog" aria-label="Pilih entitas">
  <div class="nr-picker-head">
    <label class="nr-search" style="width:100%"><svg class="nr-icon nr-icon-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="entity-search" type="search" placeholder="Cari nama atau kode"></label>
    <div class="nr-picker-actions"><span>3 dari 87 dipilih</span><span><button type="button">Pilih semua</button> · <button type="button">Kosongkan</button></span></div>
  </div>
  <div role="listbox" aria-multiselectable="true">
    <div class="nr-check" role="option" aria-checked="true"><span class="nr-box"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span><span class="nr-check-text"><b>Kantor Pusat</b><span>HO-001</span></span></div>
    <div class="nr-check" role="option" aria-checked="true"><span class="nr-box"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span><span class="nr-check-text"><b>Toko Kuta</b><span>TKO-014</span></span></div>
    <div class="nr-check" role="option" aria-checked="false"><span class="nr-box"></span><span class="nr-check-text"><b>Toko Ubud</b><span>TKO-021</span></span></div>
    <div class="nr-check" role="option" aria-checked="true"><span class="nr-box"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span><span class="nr-check-text"><b>Gudang Fresh</b><span>DC-002</span></span></div>
    <div class="nr-check" role="option" aria-checked="false"><span class="nr-box"></span><span class="nr-check-text"><b>Toko Sanur</b><span>TKO-030</span></span></div>
  </div>
  <div class="nr-picker-foot"><button class="nr-btn nr-btn-ghost" type="button">Batal</button><button class="nr-btn nr-btn-primary" type="button">Terapkan</button></div>
</div>
</div></body></html>
